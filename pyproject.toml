[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-universe"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=1.4.0",
    "fredapi>=0.5.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "duckdb>=1.0.0",
    "scipy>=1.11.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
au-update = "asset_universe.update:run"

[tool.setuptools.packages.find]
where = ["src"]
