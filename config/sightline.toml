# Holdings Sightline does NOT govern. Stated explicitly so an absent entry
# reads as a decision, not a gap.

[exemptions.gold]
reason = "Strategic anchor, held for a portfolio-level reason. No disclosed observable exists. Exit only on a mission change, which is outside Sightline's scope by construction."

[exemptions.crypto_sleeve]
reason = "Mechanical sleeve (BTC + staked ETH ETPs): hold-or-cut is delegated to its own MA50/100/200 ensemble rule and the 3-losing-cycles kill switch. No disclosed observable exists."
