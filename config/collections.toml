# Collections monitor -- sits beside Sightline, watches whether customers PAY.
#
# Why: Sightline watches demand (AI revenue YoY). A customer-funding problem
# shows up first in collections, while revenue YoY is still strongly positive
# -- AVGO's largest customer is 32% of revenue and 44% of receivables (FY2025
# 10-K), and its fastest-growing customers raise capital rather than earn it.
#
# Observable: days sales outstanding = AR (instant, quarter end) / that
# quarter's revenue x 91. Both from 10-Q/10-K XBRL; derived every run, never
# stored.
#
# Thresholds PRE-REGISTERED 2026-10-18 by the operator, before AVGO's DSO
# history was looked at. Relative, not absolute, so the business mix sets its
# own baseline:
#   WARN  = latest quarter > warn_multiple x median of the prior
#           baseline_quarters quarters. Informs only.
#   BREAK = the last confirm_quarters quarters EACH > break_multiple x their
#           own trailing median. Triggers break_action -- a REVIEW, not a
#           sell. Changed from "behaves like a CUT" the same day (2026-10-18):
#           the signal has never fired, so nothing shows it precedes a loss,
#           and slower collection can be a deliberate terms choice rather
#           than a funding failure. A trim is an option, not a rule.
# Not sticky: state reflects the latest quarters, so a resolved spike clears.
# NO Telegram alert (operator, 2026-10-18): dashboard and decide.py only.
#
# Known false-positive path, accepted: an acquisition consolidates the
# target's receivables before a full quarter of its revenue, inflating DSO
# for one quarter. confirm_quarters = 2 is what absorbs it.

[AVGO]
warn_multiple     = 1.25
break_multiple    = 1.5
baseline_quarters = 8
confirm_quarters  = 2
break_action      = "REVIEW: no new contributions to AVGO; read the latest 10-Q for which customer owes the receivables and why. Trimming is an option, not a rule -- this signal is unvalidated."
