name: lly-earnings-timing

# Manual-only, TEMPORARY (2026-10-16). Read-only.
# Delete with run_lly_earnings_timing.py once read.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -q yfinance pandas numpy
      - name: Run
        run: |
          set -o pipefail
          python run_lly_earnings_timing.py 2>&1 | tee out.txt
      - name: Step summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat out.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
