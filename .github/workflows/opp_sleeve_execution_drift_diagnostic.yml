name: opp-sleeve-execution-drift-diagnostic

# Manual-only, temporary diagnostic: does the price move between when an
# opp-sleeve candidate qualifies (screen close) and when you can
# realistically execute (next session's open) predict trade outcome --
# both forward return AND early-stop-out risk (using the live
# binding_stop() logic)? Reuses the same walk-forward, no-lookahead
# regime reconstruction as run_sleeve_entry_reconstruction.py (PR #45).
# Needs the real parquet price store, only available on the Actions
# runner. Read-only: no commits, no state changes. Delete once answered.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e .

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Run execution-drift analysis
        run: python -u run_opp_sleeve_execution_drift_analysis.py 2>&1 | tee execution_drift_output.txt
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"

      - name: Write step summary
        run: cat execution_drift_output.txt >> $GITHUB_STEP_SUMMARY
