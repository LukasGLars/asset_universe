name: tripwire-debug-diagnostic

# Manual-only, temporary, one-off diagnostic: prints the raw pre-entry
# tripwire values (RS vs benchmark, cluster health, MA50 slope) for
# specific tickers, so a "why did X fail the pre-entry gate" question can
# be answered with numbers instead of a guess. run_entry_screen.py's normal
# output only shows the final pass/fail, not which of the 3 checks did it.
# Read-only: no commits, no position changes. Delete once the question
# that prompted it is answered.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e .

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Debug pre-entry tripwire for STLD and GM
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from asset_universe import config
          import run_entry_screen as res

          data_dir = config.raw_data_dir()
          regime = res.current_regime(data_dir)
          regime_labels = regime["regimes"]
          held = res.already_held_tickers()
          gate1 = ["SNDK", "APP", "HOOD", "PLTR", "CVNA", "GEV", "SATS", "LITE", "HWM",
                   "VRT", "AVGO", "VST", "IBKR", "ANET", "DECK", "NRG", "PWR", "TRGP",
                   "DASH", "BKNG", "CF", "STLD", "FOXA", "CEG", "EXV1.DE", "CMI", "GM",
                   "NVDA", "EME", "TPR"]

          for ticker in ["STLD", "GM"]:
              passed, tw = res._pretrade_tripwire_check(ticker, "equities", gate1, held, regime_labels, data_dir)
              print(f"=== {ticker} ===")
              print(f"  overall passed : {passed}")
              print(f"  RS vs SPY 20d  : {tw['rs_20d']}   rs_ok={tw['rs_ok']}")
              print(f"  cluster_avg    : {tw['cluster_avg']}   cluster_breakdown={tw['cluster_breakdown']}   peers={tw['peer_rets']}")
              print(f"  MA50 now       : {tw['ma50_now']}   MA50 slope={tw['ma50_slope']}   ma50_rising={tw['ma50_rising']}")
          PY
        env:
          PYTHONIOENCODING: utf-8
