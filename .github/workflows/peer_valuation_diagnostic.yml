name: peer-valuation-diagnostic

# Manual-only, read-only: runs run_peer_valuation.py for a fresh peer
# valuation snapshot. Live yfinance fetch, no parquet cache needed.
# Temporary -- delete after use, same convention as this repo's other
# one-off diagnostics.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -e .
      - name: Run peer valuation snapshot
        run: python run_peer_valuation.py
