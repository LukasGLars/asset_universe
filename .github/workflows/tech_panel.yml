name: tech-panel
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-
      - run: pip install -e .
      - run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Technical panel
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0,"src")
          import pandas as pd, numpy as np
          from asset_universe import config
          from asset_universe.store import reader
          d = config.raw_data_dir()
          H = [("Gold","commodities","GC_F"),("AVGO","equities","AVGO"),
               ("LLY","equities","LLY"),("BTC","crypto","BTC-USD"),
               ("ETH","crypto","ETH-USD"),("SPY","equities","SPY")]
          def rsi(s,n=14):
              d_=s.diff();u=d_.clip(lower=0);dn=-d_.clip(upper=0)
              rs=u.ewm(alpha=1/n,adjust=False).mean()/dn.ewm(alpha=1/n,adjust=False).mean()
              return 100-100/(1+rs)
          print(f"{'':5}{'last':>11}{'MA50':>11}{'vs':>8}{'MA200':>11}{'vs':>8}"
                f"{'5d':>7}{'21d':>7}{'63d':>8}{'RSI':>5}{'52w%':>6}{'vol':>6}")
          for n,c,t in H:
              df=pd.read_parquet(reader.ticker_path(d,c,t))
              df["date"]=pd.to_datetime(df["date"])
              s=df.set_index("date")["close"].sort_index().dropna()
              if c=="crypto": s=s[s.index.dayofweek<5]
              L=float(s.iloc[-1]);m50=float(s.rolling(50).mean().iloc[-1])
              m200=float(s.rolling(200).mean().iloc[-1])
              w=s.iloc[-252:];pos=(L-w.min())/(w.max()-w.min())
              v=float(s.pct_change().iloc[-21:].std()*np.sqrt(252))
              print(f"{n:5}{L:>11,.2f}{m50:>11,.2f}{L/m50-1:>7.1%}{m200:>11,.2f}"
                    f"{L/m200-1:>7.1%}{s.iloc[-1]/s.iloc[-6]-1:>7.1%}"
                    f"{s.iloc[-1]/s.iloc[-22]-1:>7.1%}{s.iloc[-1]/s.iloc[-64]-1:>8.1%}"
                    f"{float(rsi(s).iloc[-1]):>5.0f}{pos:>6.0%}{v:>6.0%}")
          print(f"\nlast bar {s.index[-1].date()}")
          PY
