name: derisk-signal-test

# Manual-only, TEMPORARY diagnostic (2026-08-31): does reducing the Reactor
# Core when VIX and/or BAA10Y credit spreads spike beat holding static?
# Needs the real parquet store + FRED macro series, which only exist on the
# Actions runner. Read-only: no commits, no repo changes.
#
# Delete this workflow, run_derisk_signal_test.py and
# tests/test_derisk_signal_test.py once the result is logged to MEMORY.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e . pytest

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      # The no-lookahead plumbing is the whole reason this result can be
      # trusted. If the timing tests fail, do not read the numbers.
      - name: Timing / no-lookahead tests
        run: python -m pytest tests/test_derisk_signal_test.py -q

      - name: Run de-risk signal test
        run: python run_derisk_signal_test.py 2>&1 | tee derisk_signal_output.txt
        env:
          PYTHONIOENCODING: utf-8

      - name: Write step summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat derisk_signal_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload grid CSV
        uses: actions/upload-artifact@v4
        with:
          name: derisk-signal-grid
          path: comparison_results/derisk_signal_grid.csv
