name: hood-technicals

# Manual-only, TEMPORARY diagnostic (2026-10-06): descriptive technical
# snapshot of HOOD against SPY and the Core names. Not a signal -- every
# technical entry gate this project has tested was no better than random.
# Needs the real parquet store, which only exists on the Actions runner.
# Read-only: no commits, no repo changes.
#
# Delete this workflow, run_hood_technicals.py and
# tests/test_hood_technicals.py once read.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e . pytest

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      # The skim identity, the cash floor and the signal timing are what the
      # numbers turn on. If these fail, do not read the tables.
      - name: Accounting tests
        run: python -m pytest tests/test_hood_technicals.py -q

      - name: Run HOOD technicals
        run: python run_hood_technicals.py 2>&1 | tee hood_output.txt
        env:
          PYTHONIOENCODING: utf-8

      - name: Write step summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat hood_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
