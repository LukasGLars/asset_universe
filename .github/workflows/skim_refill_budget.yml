name: skim-refill-budget

# Manual-only, TEMPORARY diagnostic (2026-10-02): how often a 10%-relative
# rebalance band skims gains into cash, and whether that refills the dip-buy
# sleeve fast enough to fund the AVGO/LLY crash triggers that actually arrived.
# Follows the 2026-10-02 laddering verdict, which handed every episode a FULL
# sleeve and so never priced the refill constraint.
# Needs the real parquet store, which only exists on the Actions runner.
# Read-only: no commits, no repo changes.
#
# Delete this workflow, run_skim_refill_budget.py and
# tests/test_skim_refill_budget.py once logged to MEMORY.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e . pytest

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      # The skim identity, the cash floor and the signal timing are what the
      # numbers turn on. If these fail, do not read the tables.
      - name: Accounting tests
        run: python -m pytest tests/test_skim_refill_budget.py -q

      - name: Run skim refill budget
        run: python run_skim_refill_budget.py 2>&1 | tee skim_output.txt
        env:
          PYTHONIOENCODING: utf-8

      - name: Write step summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat skim_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
