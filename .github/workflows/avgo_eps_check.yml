name: avgo-eps-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -e .
      - name: AVGO forward-EPS consistency
        run: |
          python - <<'PY'
          import yfinance as yf, pandas as pd, numpy as np
          t = yf.Ticker("AVGO")

          print("="*70); print("AVGO — quarterly EPS actuals (yfinance earnings_history)"); print("="*70)
          eh = t.earnings_history
          print(eh.to_string() if eh is not None and len(eh) else "no earnings_history")

          if eh is not None and len(eh):
              e = eh.sort_index()
              act = e["epsActual"].dropna()
              print("\nTTM EPS walk (rolling 4q of actuals):")
              ttm = act.rolling(4).sum().dropna()
              for d, v in ttm.items():
                  print(f"  {str(d)[:10]}  TTM {v:>7.2f}")
              if len(ttm) >= 5:
                  yoy = ttm.iloc[-1]/ttm.iloc[-5]-1
                  print(f"\n  realised TTM EPS YoY: {yoy:+.1%}")
              if len(ttm) >= 2:
                  qoq = ttm.iloc[-1]/ttm.iloc[-2]-1
                  print(f"  latest TTM q/q step : {qoq:+.1%}  "
                        f"-> annualised {((1+qoq)**4-1):+.1%}")

          print("\n" + "="*70); print("Forward estimate"); print("="*70)
          try:
              tr = t.eps_trend
              print(tr.to_string() if tr is not None else "none")
          except Exception as ex:
              print("eps_trend unavailable:", ex)

          print("\n" + "="*70); print("Revenue cross-check (quarterly, income stmt)"); print("="*70)
          try:
              q = t.quarterly_income_stmt
              rev = q.loc["Total Revenue"].dropna().sort_index()
              ni  = q.loc["Net Income"].dropna().sort_index()
              rttm = rev.rolling(4).sum().dropna()
              print("  date         revenue(Q)    TTM rev     net margin(Q)")
              for d in rev.index[-8:]:
                  m = (ni.get(d, np.nan)/rev[d]) if d in ni.index else np.nan
                  tv = rttm.get(d, np.nan)
                  print(f"  {str(d)[:10]}  {rev[d]/1e9:>9.2f}B  "
                        f"{tv/1e9 if tv==tv else float('nan'):>9.2f}B  {m:>10.1%}")
              if len(rttm) >= 5:
                  print(f"\n  realised TTM revenue YoY: {rttm.iloc[-1]/rttm.iloc[-5]-1:+.1%}")
          except Exception as ex:
              print("income stmt unavailable:", ex)
          PY
