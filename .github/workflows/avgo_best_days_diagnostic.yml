name: avgo-best-days-diagnostic

# Manual-only, read-only. Measures how concentrated AVGO's return is in a
# small number of days, the symmetric worst-days mirror, whether best and
# worst days cluster together, and how many of the best days landed while
# AVGO was below its 200d SMA (i.e. inside the window the retired guard
# would have sat out). Temporary -- delete after logging.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-
      - name: Install dependencies
        run: pip install -e . pytest
      - name: Ensure local data is fresh
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Unit tests
        run: python -m pytest tests/test_avgo_best_days.py -q
      - name: AVGO best-days concentration
        run: python run_avgo_best_days.py
