name: gap-down-analysis-diagnostic

# Manual-only, temporary diagnostic: runs run_avgo_gap_down_analysis.py for
# any ticker (parametrized via workflow_dispatch inputs) -- the same
# "shopping at a discount" gap-down forward-return question originally
# built for AVGO, now generalized to Gold (GC_F) / LLY / any other ticker
# in the parquet store. Needs the real parquet price store, which only
# exists on the Actions runner. Read-only: no commits, no repo changes.
# Delete once the question that prompted it is answered.

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker symbol"
        type: string
        default: "AVGO"
      category:
        description: "Category directory (equities/commodities/etc.)"
        type: string
        default: "equities"
      era_split:
        description: "Optional YYYY-MM-DD era split (leave blank for full history only)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e .

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Run gap-down analysis
        run: |
          ARGS="--ticker ${{ inputs.ticker }} --category ${{ inputs.category }}"
          if [ -n "${{ inputs.era_split }}" ]; then
            ARGS="$ARGS --era-split ${{ inputs.era_split }}"
          fi
          python run_avgo_gap_down_analysis.py $ARGS 2>&1 | tee gap_down_analysis_output.txt
        env:
          PYTHONIOENCODING: utf-8

      - name: Write step summary
        run: cat gap_down_analysis_output.txt >> $GITHUB_STEP_SUMMARY
