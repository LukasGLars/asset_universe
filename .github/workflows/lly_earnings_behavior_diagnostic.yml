name: lly-earnings-behavior-diagnostic

# Manual-only, temporary diagnostic: LLY's own price behavior around its
# real historical earnings dates (pre-earnings run-up, reaction, post-
# earnings drift), split by beat vs miss. Needs the real parquet price
# store + a live yfinance earnings-date lookup, only available on the
# Actions runner. Read-only: no commits, no repo changes. Delete once
# the question that prompted it is answered.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e .

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Run LLY earnings behavior analysis
        run: python -u run_lly_earnings_behavior_analysis.py 2>&1 | tee lly_earnings_behavior_output.txt
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"

      - name: Write step summary
        run: cat lly_earnings_behavior_output.txt >> $GITHUB_STEP_SUMMARY
