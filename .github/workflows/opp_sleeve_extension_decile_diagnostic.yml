name: opp-sleeve-extension-decile-diagnostic

# Manual-only, temporary diagnostic: does forward return actually degrade
# as MA50 extension increases within the sleeve's real gated-entry
# population, or is extension just a pass/fail gate with no further
# information once a candidate already clears it? Reuses the same
# walk-forward, no-lookahead regime reconstruction as
# run_sleeve_entry_reconstruction.py (PR #45) -- same population, extra
# `ext` field kept instead of discarded. Needs the real parquet price
# store + yfinance earnings lookups, only available on the Actions
# runner. Read-only: no commits, no repo changes. Delete once answered.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e .

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Run extension-decile analysis
        run: python -u run_opp_sleeve_extension_decile_analysis.py 2>&1 | tee extension_decile_output.txt
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"

      - name: Write step summary
        run: cat extension_decile_output.txt >> $GITHUB_STEP_SUMMARY
