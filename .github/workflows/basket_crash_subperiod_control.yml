name: basket-crash-subperiod-control

# Manual-only, TEMPORARY diagnostic (2026-09-17): the sub-period split and
# date-matched market control that basket_crash never got. The opportunistic
# sleeve was retired on evidence containing zero basket_crash trades, so this
# decides whether that entry type was a real edge or a regime artifact.
# Needs the real parquet store, which only exists on the Actions runner.
# Read-only: no commits, no repo changes.
#
# Delete this workflow, run_basket_crash_subperiod_control.py and
# tests/test_basket_crash_subperiod_control.py once logged to MEMORY.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e . pytest

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      # The date-matched control is what the verdict turns on. If these fail,
      # do not read the numbers.
      - name: Control / accounting tests
        run: python -m pytest tests/test_basket_crash_subperiod_control.py -q

      - name: Run sub-period + control analysis
        run: python run_basket_crash_subperiod_control.py 2>&1 | tee basket_crash_output.txt
        env:
          PYTHONIOENCODING: utf-8

      - name: Write step summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat basket_crash_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload CSVs
        uses: actions/upload-artifact@v4
        with:
          name: basket-crash-subperiod
          path: comparison_results/basket_crash_*.csv
