name: entry-screen-check

# Manual-only, read-only diagnostic: prints the opportunistic sleeve's full
# status -- if a position is open, the exit triggers + all 4 post-entry
# tripwires (RS vs benchmark, regime change, cluster health, MA50 slope);
# if closed, the current best entry candidate. This is the detail behind
# check_signal_changes.py's "Sleeve risk: X -> TRIPWIRE" Telegram alert,
# which only carries the state transition, not which check(s) actually
# fired.
#
# Restores the same parquet cache daily-sync populates (fast, no full
# refetch) and runs check_local_data_freshness.py first, which
# auto-refreshes if the cache is stale rather than trusting it blindly.
# Never commits, pushes, or opens/closes a position -- pure read/print.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e .

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Opportunistic sleeve status / entry screen
        run: python run_entry_screen.py 2>&1 | tee entry_screen_output.txt
        env:
          PYTHONIOENCODING: utf-8

      - name: Write step summary
        run: cat entry_screen_output.txt >> $GITHUB_STEP_SUMMARY
