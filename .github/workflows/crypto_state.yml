name: crypto-state

# Manual-only, TEMPORARY (2026-10-14): live BTC/ETH state against the trend
# sleeve's own rule. Read-only. Delete with run_crypto_state.py once read.
# Block style throughout -- a flow mapping containing "${{" is invalid YAML.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-
      - name: Install dependencies
        run: pip install -e .
      - name: Ensure local data is fresh
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Run crypto state
        run: |
          set -o pipefail
          python run_crypto_state.py 2>&1 | tee crypto.txt
        env:
          PYTHONIOENCODING: utf-8
      - name: Step summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat crypto.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
