name: opp-sleeve-stop-sensitivity-diagnostic

# Manual-only, temporary diagnostic: runs run_opp_sleeve_stop_sensitivity.py
# (the hard-stop-cutoff N x trailing-peak-stop sensitivity study, prompted
# by the 2026-07-23 HWM trade -- see MEMORY.md) and writes its output to the
# step summary. Needs the real parquet price store across the whole US
# equities universe, which only exists on the Actions runner -- this is the
# only way to get real numbers out of that script right now. Read-only: no
# commits, no repo changes. Delete once the opp-sleeve stop refinement
# question is settled and the parameters are implemented.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e .

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Run opportunistic sleeve stop sensitivity study
        run: python run_opp_sleeve_stop_sensitivity.py 2>&1 | tee opp_sleeve_stop_sensitivity_output.txt
        env:
          PYTHONIOENCODING: utf-8

      - name: Write step summary
        run: cat opp_sleeve_stop_sensitivity_output.txt >> $GITHUB_STEP_SUMMARY
