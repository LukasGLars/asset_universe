name: cluster-sector-diagnostic

# Manual-only, temporary diagnostic: prints yfinance's `sector` (coarse,
# ~11 GICS buckets) and `industry` (fine-grained) fields for HWM and its
# recorded opportunistic-sleeve cluster peers (GEV, VRT, PWR, CMI), to
# check whether discover_cluster_peers()'s sector-only matching in
# run_entry_screen.py produced a economically meaningful peer group for
# HWM specifically, or just a coarse "same broad GICS sector" match.
# Read-only: no writes to the repo, no changes to sleeve_state.toml.
# Delete once the classification question is settled.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install yfinance
        run: pip install yfinance

      - name: Print sector/industry for HWM + recorded cluster peers
        run: |
          python3 - <<'PYEOF'
          import yfinance as yf
          tickers = ["HWM", "GEV", "VRT", "PWR", "CMI"]
          print(f"{'Ticker':<8} {'Sector':<20} {'Industry'}")
          print("-" * 70)
          for t in tickers:
              info = yf.Ticker(t).info
              print(f"{t:<8} {info.get('sector', 'n/a'):<20} {info.get('industry', 'n/a')}")
          PYEOF
