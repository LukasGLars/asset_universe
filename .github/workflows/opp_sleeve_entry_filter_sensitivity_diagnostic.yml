name: opp-sleeve-entry-filter-sensitivity-diagnostic

# Manual-only, temporary diagnostic: runs run_opp_sleeve_entry_filter_sensitivity.py
# -- tests whether tightening the opp sleeve's ENTRY side further (RS margin,
# MA50 slope strength, a VIX-calm gate, a diversity/sample-size proxy) raises
# the win rate on the real 4-gate entry population, prompted by STLD/GM's
# 2026-07-26 near-misses. Needs the real parquet price store across the whole
# US equities universe plus VIX, which only exists on the Actions runner.
# Read-only: no commits, no repo changes. Delete once the entry-filter
# question is settled and any resulting change is implemented (or the answer
# is "no change").

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e .

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Run opportunistic sleeve entry-filter sensitivity study
        run: python run_opp_sleeve_entry_filter_sensitivity.py 2>&1 | tee opp_sleeve_entry_filter_sensitivity_output.txt
        env:
          PYTHONIOENCODING: utf-8

      - name: Write step summary
        run: cat opp_sleeve_entry_filter_sensitivity_output.txt >> $GITHUB_STEP_SUMMARY
