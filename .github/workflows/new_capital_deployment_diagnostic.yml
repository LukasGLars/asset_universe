name: new-capital-deployment-diagnostic

# Manual-only, read-only diagnostic: tests where NEW (previously
# uninvested) capital should go at a real AVGO crash-ROC trigger --
# straight into AVGO (dip-buy), into the guard's own defensive mix, or
# into the unguarded base mix -- using every real declustered trigger in
# AVGO's 2009-2026 history. See run_new_capital_deployment_test.py's
# docstring. Delete this workflow (and the script + its test) once the
# result is logged to MEMORY.md -- same convention as this repo's other
# one-off diagnostics.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e .

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: New capital deployment test
        run: python run_new_capital_deployment_test.py 2>&1 | tee new_capital_deployment_output.txt
        env:
          PYTHONIOENCODING: utf-8

      - name: Write step summary
        run: cat new_capital_deployment_output.txt >> $GITHUB_STEP_SUMMARY
