name: btc-in-core

# Manual-only, TEMPORARY diagnostic (2026-08-31): what happens to the
# portfolio if x% of the Reactor Core is held in the Virtune Bitcoin ETP?
# Models the real instrument (1.49% fee, 0.16% spread, weekday-only, SEK)
# and both arms: buy-and-hold and the already-adopted 150d rule.
# Needs the parquet store for USDSEK and the core assets, and fetches
# BTC-USD live since it is not in the universe. Read-only.
#
# Delete this workflow, run_btc_in_core.py and
# tests/test_btc_in_core.py once the result is logged to MEMORY.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e . pytest

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      # The bucket-blend accounting is what the recommendation rests on.
      # If these fail, do not read the numbers.
      - name: Fee-basis / blend accounting tests
        run: python -m pytest tests/test_btc_in_core.py -q

      - name: Run btc-in-core analysis
        run: python run_btc_in_core.py 2>&1 | tee btc_in_core_output.txt
        env:
          PYTHONIOENCODING: utf-8

      - name: Write step summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat btc_in_core_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload grid CSV
        uses: actions/upload-artifact@v4
        with:
          name: btc-in-core-grid
          path: comparison_results/btc_in_core_grid.csv
