name: opp-sleeve-vol-scaled-trailing-sensitivity-diagnostic

# Manual-only, temporary diagnostic: runs run_opp_sleeve_vol_scaled_trailing_sensitivity.py
# -- tests whether a volatility-scaled trailing stop (different trigger/pct
# per vol bucket) beats the current live global 5%/5% rule, holding the rest
# of the live exit logic fixed (MA50 buffer 5%, no hard stop, 21d duration).
# Needs the real parquet price store across the whole US equities universe,
# which only exists on the Actions runner. Read-only: no commits, no repo
# changes. Delete once the question is settled and any resulting change is
# implemented (or the answer is "no change").

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e .

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Run opportunistic sleeve vol-scaled trailing-stop sensitivity study
        run: python run_opp_sleeve_vol_scaled_trailing_sensitivity.py 2>&1 | tee opp_sleeve_vol_scaled_trailing_sensitivity_output.txt
        env:
          PYTHONIOENCODING: utf-8

      - name: Write step summary
        run: cat opp_sleeve_vol_scaled_trailing_sensitivity_output.txt >> $GITHUB_STEP_SUMMARY
