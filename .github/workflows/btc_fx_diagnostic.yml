name: btc-fx-diagnostic

# Manual-only, read-only. Closes gap #1 from the 2026-08-24 ETP-execution
# entry: adds the SEK/USD leg the BTC trend work was missing. Virtune
# Bitcoin is SEK-denominated tracking a USD asset, so holding it is long
# BTC AND long USD vs SEK. Scores 150d in SEK against buy-and-hold BTC-SEK.
# Needs the parquet cache for USDSEK=X (fx category, repo's own convention).
# Temporary -- delete after logging.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-
      - name: Install dependencies
        run: pip install -e . pytest
      - name: Ensure local data is fresh
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Unit tests for the FX mechanics
        run: python -m pytest tests/test_btc_fx_check.py -q
      - name: BTC FX check
        run: python run_btc_fx_check.py
