name: avgo-breakout-signal

# Manual-only, TEMPORARY diagnostic (2026-10-06): does a volume-confirmed
# breakout above recent resistance beat simply holding AVGO? Pre-committed
# kill criteria are in the script header. Read-only.
#
# Delete this workflow, run_avgo_breakout_signal.py and
# tests/test_avgo_breakout_signal.py once logged to MEMORY.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-
      - name: Install dependencies
        run: pip install -e . pytest
      - name: Ensure local data is fresh
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      # The signal must not see its own bar and the entry must not see the
      # future. If these fail, do not read the tables.
      - name: Signal-integrity tests
        run: python -m pytest tests/test_avgo_breakout_signal.py -q
      - name: Run breakout signal test
        # pipefail so a crashed script fails the step rather than tee masking it
        run: |
          set -o pipefail
          python run_avgo_breakout_signal.py 2>&1 | tee breakout.txt
        env:
          PYTHONIOENCODING: utf-8
      - name: Write step summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat breakout.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
