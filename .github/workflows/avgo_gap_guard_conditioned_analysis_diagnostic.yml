name: avgo-gap-guard-conditioned-analysis-diagnostic

# Manual-only, temporary diagnostic: runs run_avgo_gap_guard_conditioned_analysis.py --
# splits AVGO's gap-down forward returns by 200d Guard state on the gap day
# (reconstructed with the same point-in-time logic as the live guard), to
# test whether guard state adds real information beyond the raw gap-down
# signal (run_avgo_gap_down_analysis.py). Needs the real parquet price
# store, which only exists on the Actions runner. Read-only: no commits,
# no repo changes. Delete once the question that prompted it is answered.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e .

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Run AVGO gap-down x guard-state conditioned analysis
        run: python run_avgo_gap_guard_conditioned_analysis.py 2>&1 | tee avgo_gap_guard_conditioned_analysis_output.txt
        env:
          PYTHONIOENCODING: utf-8

      - name: Write step summary
        run: cat avgo_gap_guard_conditioned_analysis_output.txt >> $GITHUB_STEP_SUMMARY
