name: sync-sheet

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours, any day
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tomllib shim (stdlib in 3.11+, no extra deps needed)
        run: python -c "import tomllib; print('tomllib ok')"

      - name: Watchdog -- catch a missed daily-sync schedule
        run: python check_daily_sync_watchdog.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}

      - name: Sync Google Sheet → portfolio.toml
        run: python sync_sheet.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/portfolio.toml
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "chore(sheet): sync portfolio positions [skip ci]"
          git pull --rebase origin master
          git push
