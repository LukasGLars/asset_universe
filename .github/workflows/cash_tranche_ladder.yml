name: cash-tranche-ladder

# Manual-only, TEMPORARY diagnostic (2026-10-02): how to deploy the standing
# 10% cash position in the Reactor Core target -- all at the crash trigger, or
# laddered into deeper levels. Distinct from the 2026-08-18 contribution-split
# test, which asked whether to manufacture cash at all (answer: no).
# Needs the real parquet store, which only exists on the Actions runner.
# Read-only: no commits, no repo changes.
#
# Delete this workflow, run_cash_tranche_ladder.py and
# tests/test_cash_tranche_ladder.py once logged to MEMORY.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e . pytest

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      # The cash charge and the no-lookahead guards are what the verdict turns
      # on. If these fail, do not read the ladder table.
      - name: Accounting tests
        run: python -m pytest tests/test_cash_tranche_ladder.py -q

      - name: Run tranche ladder analysis
        run: python run_cash_tranche_ladder.py 2>&1 | tee tranche_output.txt
        env:
          PYTHONIOENCODING: utf-8

      - name: Write step summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat tranche_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
