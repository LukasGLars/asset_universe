name: btc-correlation-diagnostic

# Manual-only, read-only: BTC-USD correlation vs AVGO/LLY/Gold. BTC-USD
# fetched fresh via yfinance (not in the tracked universe); AVGO/LLY/Gold
# read from the existing parquet cache. Temporary -- delete after use.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-
      - name: Install dependencies
        run: pip install -e .
      - name: Ensure local data is fresh
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: BTC correlation check
        run: python run_btc_correlation_check.py
