name: base-optimizer-with-guard-diagnostic

# Manual-only, temporary diagnostic: runs run_base_optimizer_with_guard.py
# (the 231-combination base-weight grid x full guard overlay, logged
# 2026-07-17) and writes its output to the step summary. Needs the real
# parquet price store, which only exists on the Actions runner -- this is
# the only way to get real numbers out of that script right now. Read-only:
# no commits, no repo changes. Delete once the base-weight question is
# settled.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e .

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Run base optimizer with guard overlay
        run: python run_base_optimizer_with_guard.py 2>&1 | tee base_optimizer_with_guard_output.txt
        env:
          PYTHONIOENCODING: utf-8

      - name: Write step summary
        run: cat base_optimizer_with_guard_output.txt >> $GITHUB_STEP_SUMMARY
