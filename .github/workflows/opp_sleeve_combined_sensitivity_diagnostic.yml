name: opp-sleeve-combined-sensitivity-diagnostic

# Manual-only, temporary diagnostic: runs run_opp_sleeve_combined_sensitivity.py
# (stop config x hold duration tested jointly on the real 4-gate entry
# population, stratified by entry-volatility tercile -- see MEMORY.md and
# run_opp_sleeve_stop_sensitivity.py / run_sleeve_entry_reconstruction.py,
# the two narrower studies this one combines). Needs the real parquet price
# store across the whole US equities universe, which only exists on the
# Actions runner -- this is the only way to get real numbers out of this
# script right now. Read-only: no commits, no repo changes. Delete once the
# combined stop/duration question is settled and any resulting change is
# implemented (or the answer is "no change").

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e .

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Run opportunistic sleeve combined stop x duration sensitivity study
        run: python run_opp_sleeve_combined_sensitivity.py 2>&1 | tee opp_sleeve_combined_sensitivity_output.txt
        env:
          PYTHONIOENCODING: utf-8

      - name: Write step summary
        run: cat opp_sleeve_combined_sensitivity_output.txt >> $GITHUB_STEP_SUMMARY
