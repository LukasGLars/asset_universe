name: btc-momentum-validation-diagnostic

# Manual-only, read-only. VERIFIES the 2026-08-24 BTC 200d-trend result
# against six independent failure modes (annualization, lookahead twin,
# next-open execution, parameter grid, sub-periods, cost sensitivity).
# See run_btc_momentum_validation.py's docstring. BTC-USD fetched fresh
# via yfinance; no parquet cache needed. Temporary -- delete after logging.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -e .
      - name: Unit tests for the validation mechanics
        run: python -m pytest tests/test_btc_momentum_validation.py -q
      - name: BTC momentum validation
        run: python run_btc_momentum_validation.py
