name: crypto-live

# Manual-only, TEMPORARY (2026-10-14): intraday BTC/ETH quote from the runner,
# which has open egress (this container's proxy blocks the price APIs).
# Read-only. Delete with run_crypto_live.py once read.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install yfinance
        run: pip install -q yfinance
      - name: Quote
        run: |
          set -o pipefail
          python run_crypto_live.py 2>&1 | tee live.txt
      - name: Step summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat live.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
