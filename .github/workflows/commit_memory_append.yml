      - name: Append to MEMORY.md (idempotent) and drop the diagnostics
        run: |
          python3 - <<'PY'
          import base64, pathlib
          sec = base64.b64decode(
              pathlib.Path("/tmp/section.b64").read_text().replace(" ", "").replace("\n", "")
          ).decode()
          mem = pathlib.Path("MEMORY.md")
          txt = mem.read_text()
          key = "AVGO's return is EXTREMELY concentrated"
          if key in txt:
              print("Section already present -- no append.")
          else:
              mem.write_text(txt + sec)
              print(f"Appended {len(sec)} chars to MEMORY.md")
          PY
          rm -f run_avgo_best_days.py \
                tests/test_avgo_best_days.py \
                .github/workflows/avgo_best_days_diagnostic.yml

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Log AVGO best-days concentration finding; remove diagnostics"
            git push origin master
          fi
