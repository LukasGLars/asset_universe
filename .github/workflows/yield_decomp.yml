name: yield-decomp
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -e .
      - name: Decompose the yield move
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python - <<'PY'
          import os, pandas as pd
          from fredapi import Fred
          f = Fred(api_key=os.environ["FRED_API_KEY"])
          S = {
            "DGS2":"2Y nominal", "DGS10":"10Y nominal", "DGS30":"30Y nominal",
            "DFII10":"10Y real (TIPS)", "T10YIE":"10Y breakeven",
            "THREEFYTP10":"10Y TERM PREMIUM (ACM)",
            "BAMLH0A0HYM2":"HY OAS", "BAA10Y":"Baa-10Y",
            "DTWEXBGS":"USD broad index",
          }
          d = {}
          for k in S:
              try:
                  d[k] = f.get_series(k, observation_start="2026-01-01").dropna()
              except Exception as e:
                  print(f"  {k}: FAILED {e}")
          df = pd.DataFrame(d).ffill()
          last = df.index[-1]
          print(f"Latest observation: {last.date()}\n")
          print(f"{'series':<26}{'now':>9}{'1w chg':>9}{'1m chg':>9}{'3m chg':>9}")
          for k, lab in S.items():
              if k not in df: continue
              s = df[k]
              def chg(days):
                  t = last - pd.Timedelta(days=days)
                  p = s[s.index <= t]
                  return s.iloc[-1] - p.iloc[-1] if len(p) else float("nan")
              u = "bp" if k != "DTWEXBGS" else ""
              m = 100 if k != "DTWEXBGS" else 1
              print(f"{lab:<26}{s.iloc[-1]:>9.2f}{chg(7)*m:>8.0f}{u}"
                    f"{chg(30)*m:>8.0f}{u}{chg(90)*m:>8.0f}{u}")

          print("\n--- decomposition of the 10Y ---")
          if {"DGS10","DFII10","T10YIE"} <= set(df):
              for days, lab in ((7,"1 week"),(30,"1 month"),(90,"3 months")):
                  t = last - pd.Timedelta(days=days)
                  def c(k):
                      p = df[k][df.index <= t]
                      return (df[k].iloc[-1] - p.iloc[-1])*100 if len(p) else float("nan")
                  print(f"  {lab:<9} nominal {c('DGS10'):+6.0f}bp  =  "
                        f"real {c('DFII10'):+6.0f}bp  +  breakeven {c('T10YIE'):+6.0f}bp"
                        + (f"   | term premium {c('THREEFYTP10'):+6.0f}bp"
                           if "THREEFYTP10" in df else ""))
          print("\n--- curve ---")
          if {"DGS2","DGS10"} <= set(df):
              print(f"  10Y-2Y now {(df['DGS10'].iloc[-1]-df['DGS2'].iloc[-1])*100:+.0f}bp")
              for days, lab in ((7,"1w"),(30,"1m"),(90,"3m")):
                  t = last - pd.Timedelta(days=days)
                  p2 = df['DGS2'][df.index<=t]; p10 = df['DGS10'][df.index<=t]
                  if len(p2) and len(p10):
                      d2 = (df['DGS2'].iloc[-1]-p2.iloc[-1])*100
                      d10 = (df['DGS10'].iloc[-1]-p10.iloc[-1])*100
                      shape = "bear steepening" if d10>d2 else "bear flattening" if d10<d2 else "parallel"
                      print(f"  {lab}: 2Y {d2:+.0f}bp, 10Y {d10:+.0f}bp -> {shape}")
          PY
