name: preview-signal-notification

# Manual-only, one-off review tool: generates a REAL status.md from live
# data, then builds a throwaway *local, uncommitted* copy with the AVGO
# guard line flipped to simulate a real signal change, and runs it through
# the actual production notify_signal_changes.py -- same code, same
# secrets, real send (Telegram, migrated 2026-07-03 from the original
# Gmail-based version). Nothing in this workflow ever commits, pushes, or
# modifies any tracked file in the repo; the fake "previous" snapshot only
# ever exists on the ephemeral runner's disk. Safe to run repeatedly.
#
# Originally added 2026-07-02 for the email pipeline review; kept as a
# standing review tool since it's proven useful more than once.
#
# 2026-07-30: added signal_type input (sleeve_candidate_extension /
# sleeve_candidate_basket) to preview the new self-contained Plan/Open
# sleeve alerts. Checkout switched from a hardcoded `ref: master` to the
# triggering ref -- needed so this can preview code still in an open PR
# (like the basket-crash build itself) rather than only what's already on
# master. Dispatching with no ref override still resolves to the repo's
# default branch (master), so ordinary manual runs are unaffected.

on:
  workflow_dispatch:
    inputs:
      signal_type:
        description: 'Which signal to simulate'
        required: true
        default: avgo_guard
        type: choice
        options:
          - avgo_guard
          - sleeve_candidate_extension
          - sleeve_candidate_basket

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e .

      - name: Update prices (read-only, no commit)
        run: python -m asset_universe.update
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Generate real current status.md (local only, not committed)
        run: python fi_tracker.py > preview_status_curr.md 2>&1
        env:
          PYTHONIOENCODING: utf-8

      - name: Show the real sleeve section (debug -- diagnoses splice mismatches)
        run: sed -n '/Opportunistic Sleeve/,/^$/p' preview_status_curr.md

      - name: Build fake prev/curr snapshots (local only, simulates the selected signal)
        env:
          SIGNAL_TYPE: ${{ github.event.inputs.signal_type || 'avgo_guard' }}
        run: |
          python - <<'PYEOF'
          import os

          curr_real = open("preview_status_curr.md", encoding="utf-8").read()
          signal_type = os.environ["SIGNAL_TYPE"]

          if signal_type == "avgo_guard":
              # Flips curr -> prev (simulates guard just having been active,
              # regardless of today's real state -- see module docstring).
              prev = curr_real.replace(
                  "Signal         : BASE  (trigger: none)",
                  "Signal         : DEFENSIVE  (trigger: CRASH)",
              ).replace(
                  "Action         : Hold base (Gold 25%, AVGO 55%, LLY 20%)",
                  "Action         : Rotate AVGO -> Gold+LLY (Gold 52.5%, AVGO 0%, LLY 47.5%)",
              )
              curr = curr_real

          elif signal_type == "sleeve_candidate_extension":
              # prev = today's real "no candidate" text, unmodified (this is
              # genuinely what a closed sleeve with no ENTER looks like).
              # curr = the same text with a realistic candidate spliced in --
              # this part IS synthetic (no live candidate exists to preview
              # from today's real data), clearly a preview, not a real signal.
              prev = curr_real
              curr = curr_real.replace(
                  "    Best candidate : none eligible today (either no ENTER survivors, or all "
                  "failed the pre-entry tripwire or execution-drift gate)",
                  "    Best candidate : HWM (Howmet Aerospace)  $275.43  (ext +1.2%, 21d med +4.1%, div ROBUST)\n"
                  "    Plan           : buy near $275.43, hold ~21d, stop = MA50-5% then trails 3% once +5% gain\n"
                  "    Open           : run_entry_screen.py --open HWM <fill_price> <shares> <capital_sek>",
              )

          elif signal_type == "sleeve_candidate_basket":
              prev = curr_real
              curr = curr_real.replace(
                  "    Basket-crash   : none eligible today",
                  "    Basket-crash   : EME (Emerson Electric Co.)  $650.12  (sector Industrials, -14.0% 5d, "
                  "2 peers crashing)\n"
                  "    Plan           : buy near $650.12, flat 21d exit, NO stop until +8% gain then trails 8% "
                  "(no floor before that -- riskier than the extension pathway above)\n"
                  "    Open           : run_entry_screen.py --open EME <fill_price> <shares> <capital_sek> "
                  "--entry-type basket_crash",
              )

          else:
              raise SystemExit(f"Unknown signal_type: {signal_type}")

          open("preview_status_prev.md", "w", encoding="utf-8").write(prev)
          open("preview_status_curr.md", "w", encoding="utf-8").write(curr)
          PYEOF

      - name: Show what will be sent (visible in this log for review)
        run: |
          echo "--- Actionable message that will be sent ---"
          python -c "
          from check_signal_changes import extract_fingerprint, build_actionable_message
          prev = extract_fingerprint(open('preview_status_prev.md', encoding='utf-8').read())
          curr = extract_fingerprint(open('preview_status_curr.md', encoding='utf-8').read())
          result = build_actionable_message(prev, curr)
          if result is None:
              print('No actionable change detected.')
          else:
              subject, body = result
              print(f'SUBJECT: {subject}')
              print(f'BODY:\n{body}')
          "

      - name: Send the real preview notification (production code, real secrets, real send)
        run: python notify_signal_changes.py preview_status_prev.md preview_status_curr.md
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
