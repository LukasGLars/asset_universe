name: preview-signal-notification

# Manual-only, one-off review tool: generates a REAL status.md from live
# data, then builds a throwaway *local, uncommitted* copy with the AVGO
# guard line flipped to simulate a real signal change, and runs it through
# the actual production notify_signal_changes.py -- same code, same
# secrets, real send (Telegram, migrated 2026-07-03 from the original
# Gmail-based version). Nothing in this workflow ever commits, pushes, or
# modifies any tracked file in the repo; the fake "previous" snapshot only
# ever exists on the ephemeral runner's disk. Safe to run repeatedly.
#
# Originally added 2026-07-02 for the email pipeline review; kept as a
# standing review tool since it's proven useful more than once.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e .

      - name: Update prices (read-only, no commit)
        run: python -m asset_universe.update
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Generate real current status.md (local only, not committed)
        run: python fi_tracker.py > preview_status_curr.md 2>&1
        env:
          PYTHONIOENCODING: utf-8

      - name: Build a fake "previous" snapshot (local only, simulates a real AVGO guard flip)
        run: |
          python - <<'PYEOF'
          text = open("preview_status_curr.md", encoding="utf-8").read()
          fake_prev = text.replace(
              "Signal         : BASE  (trigger: none)",
              "Signal         : DEFENSIVE  (trigger: CRASH)",
          ).replace(
              "Action         : Hold base (Gold 25%, AVGO 55%, LLY 20%)",
              "Action         : Rotate AVGO -> Gold+LLY (Gold 52.5%, AVGO 0%, LLY 47.5%)",
          )
          open("preview_status_prev.md", "w", encoding="utf-8").write(fake_prev)
          PYEOF

      - name: Show what will be sent (visible in this log for review)
        run: |
          echo "--- Actionable message that will be sent ---"
          python -c "
          from check_signal_changes import extract_fingerprint, build_actionable_message
          prev = extract_fingerprint(open('preview_status_prev.md', encoding='utf-8').read())
          curr = extract_fingerprint(open('preview_status_curr.md', encoding='utf-8').read())
          result = build_actionable_message(prev, curr)
          if result is None:
              print('No actionable change detected.')
          else:
              subject, body = result
              print(f'SUBJECT: {subject}')
              print(f'BODY:\n{body}')
          "

      - name: Send the real preview notification (production code, real secrets, real send)
        run: python notify_signal_changes.py preview_status_prev.md preview_status_curr.md
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
