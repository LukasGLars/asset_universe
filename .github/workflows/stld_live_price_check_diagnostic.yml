name: stld-live-price-check-diagnostic

# Manual-only, temporary diagnostic: re-checks STLD's opp-sleeve extension
# and pre-entry tripwire gate using TODAY'S live/premarket quote spliced
# onto the stored history in-memory, instead of yesterday's stale close --
# answers whether chasing the overnight + premarket move still clears the
# same gates that earned yesterday's ENTER signal. Read-only: no commits,
# no state changes, no live position opened. Delete once answered.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e .

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Live-price STLD re-check
        run: python check_stld_live_price.py 2>&1 | tee stld_live_check_output.txt
        env:
          PYTHONIOENCODING: utf-8

      - name: Write step summary
        run: cat stld_live_check_output.txt >> $GITHUB_STEP_SUMMARY
