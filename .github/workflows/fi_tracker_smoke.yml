name: fi-tracker-smoke

# Manual-only, TEMPORARY (2026-10-09): runs fi_tracker.py against the real
# store to verify the reworked contribution routing / rebalance / cash blocks
# render correctly on live data. Read-only -- does NOT commit status.md and
# does NOT run notify_signal_changes.py, so no alert can fire from it.
#
# Delete once the routing change is verified and merged.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-
      - name: Install dependencies
        run: pip install -e . pytest
      - name: Ensure local data is fresh
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Unit tests for the routing helpers
        run: python -m pytest tests/test_next_contribution.py tests/test_vol_target.py -q
      - name: Run fi_tracker (stdout only, nothing committed)
        run: |
          set -o pipefail
          python fi_tracker.py 2>&1 | tee smoke.md
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Fail if any section rendered as unavailable
        run: |
          if grep -nE "unavailable|Traceback" smoke.md; then
            echo "::error::a dashboard section failed to render"
            exit 1
          fi
          echo "all sections rendered"
      # The gap that let PR #119 ship a dead drift alert: the unit tests pass
      # against a FIXTURE, so renaming a heading in fi_tracker breaks the
      # parser while every test stays green and the panel still renders. This
      # step closes the loop -- the alerter must read what fi_tracker just
      # printed, not what a fixture says it prints.
      - name: Parser contract -- the alerter must read the real panel
        run: |
          python - <<'EOF'
          from check_signal_changes import extract_fingerprint
          fp = extract_fingerprint(open("smoke.md").read())

          rows = fp["rebal_rows"]
          assert rows, "rebalance block did not parse -- format contract broken"
          for name, row in rows.items():
              assert row["status"] in ("HOLD", "SELL", "BUY"), f"{name}: {row['status']!r}"
          print(f"rebalance rows parsed: {sorted(rows)}")

          must_parse = [
              "avgo_guard", "avgo_trigger", "avgo_action", "lly_stress",
              "silver_signal", "sleeve_status", "hy_oas",
              "sightline_avgo_state", "sightline_lly_state",
              "crypto_btc_exposure", "crypto_eth_exposure",
              "avgo_latest_quarter", "lly_latest_quarter",
          ]
          dead = [k for k in must_parse if fp[k] == "unknown"]
          assert not dead, f"fields degraded to 'unknown': {dead}"
          print(f"all {len(must_parse)} alert fields parsed")
          EOF

      - name: Show the reworked blocks
        run: |
          sed -n '/NEXT CONTRIBUTION/,/^=\{10,\}$/p' smoke.md
      - name: Step summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          sed -n '/REACTOR CORE/,/FI@50/p' smoke.md >> $GITHUB_STEP_SUMMARY
          sed -n '/NEXT CONTRIBUTION/,$p' smoke.md >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
