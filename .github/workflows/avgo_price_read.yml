name: avgo-price-read

# Manual-only, TEMPORARY (2026-10-06): raw AVGO price structure, no thresholds.
# Read-only. Delete with run_avgo_price_read.py once read.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-
      - name: Install dependencies
        run: pip install -e .
      - name: Ensure local data is fresh
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Run AVGO price read
        run: python run_avgo_price_read.py 2>&1 | tee avgo_price.txt
        env:
          PYTHONIOENCODING: utf-8
      - name: Write step summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat avgo_price.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
