name: avgo-guard-basket-crash-overlap-diagnostic

# Manual-only, temporary diagnostic: does AVGO's own crash-ROC guard
# trigger more often as a solo idiosyncratic move or as part of a sector-
# wide semiconductor selloff, and does AVGO's own forward return differ
# between the two? Follow-up to MEMORY.md's backlogged crash-ROC
# false-alarm item (2026-08-03). Needs the real parquet price store for
# AVGO plus live yfinance history for semiconductor peers -- only
# available on the Actions runner. Read-only: no commits, no repo
# changes. Delete once the question that prompted it is answered.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e .

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Run AVGO guard / basket-crash overlap analysis
        run: python -u run_avgo_guard_basket_crash_overlap.py 2>&1 | tee avgo_overlap_output.txt
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"

      - name: Write step summary
        run: cat avgo_overlap_output.txt >> $GITHUB_STEP_SUMMARY
