name: px-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-
      - run: pip install -e .
      - run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Print WDC / LITE
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0,"src")
          import pandas as pd
          from asset_universe import config
          from asset_universe.store import reader
          d = config.raw_data_dir()
          for t, px, dt in (("WDC",435.38,"2026-08-25"), ("LITE",838.96,"2026-09-16")):
              s = pd.read_parquet(reader.ticker_path(d,"equities",t))
              s["date"] = pd.to_datetime(s["date"]); s = s.set_index("date")["close"].sort_index()
              now, nd = float(s.iloc[-1]), s.index[-1].date()
              at = s.asof(pd.Timestamp(dt))
              print(f"{t}: alert {dt} ${px:,.2f} (store ${at:,.2f}) -> {nd} ${now:,.2f}  {now/px-1:+.1%}")
          PY
