name: daily-sync

on:
  schedule:
    # Offset off round minutes (2026-07-08): measured every scheduled run
    # since 2026-06-25 and found a consistent 166-286min delay on the old
    # ':00' morning slot and 66-90min on the old ':30' evening slot, every
    # single day -- sync-sheet, which also hits :00 among its 12 daily
    # fires, averages only ~8min delay, so this is specific to competing
    # for exact round-minute queue slots, not general GitHub congestion.
    # Matches GitHub's own documented advice to avoid the top of the hour.
    - cron: '37 20 * * 1-5'   # ~22:37 CEST Mon-Fri — after NYSE close
    - cron: '7 6 * * 1-5'     # ~08:07 CEST Mon-Fri — morning FRED catch-up
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Force-send a test Telegram message (bypasses signal-change diff)"
        type: boolean
        default: false
      suppress_notify:
        description: "Suppress signal-change notification (use when this run is a state correction, not a real event)"
        type: boolean
        default: false
      force_send_rebalance:
        description: "Resend whatever is CURRENTLY out of band in the AVGO Rebalance Check, bypassing the diff (use when a real out-of-band condition predates the alert and can't self-announce)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Serializes overlapping runs (e.g. a delayed cron firing while a manual
  # dispatch or watchdog re-trigger is still in flight) instead of letting
  # them race to commit -- found for real 2026-07-07: a delayed schedule
  # run and a manual dispatch both tried to push a status.md update, the
  # second one's `git pull --rebase` hit a real merge conflict and the
  # whole job failed outright. cancel-in-progress: false so a queued run
  # still executes fresh (after the first finishes and pushes) rather
  # than being dropped -- no run's work is lost, they just serialize.
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e .

      - name: Snapshot previous status.md
        run: cp status.md status.md.prev || true

      - name: Sync Google Sheet → portfolio.toml
        run: python sync_sheet.py

      - name: Update prices
        run: python -m asset_universe.update
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Verify data is actually fresh (not just that the update ran)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Save parquet cache
        uses: actions/cache/save@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}

      - name: Refresh universe screen
        run: mkdir -p logs && python run_universe_screen.py > logs/universe_screen.log 2>&1
        env:
          PYTHONIOENCODING: utf-8

      - name: Run fi_tracker
        run: python fi_tracker.py 2>&1 | tee status.md
        env:
          PYTHONIOENCODING: utf-8

      - name: Regime change alert
        run: python run_regime_alert.py 2>&1 | tee -a status.md
        env:
          PYTHONIOENCODING: utf-8

      - name: Portfolio optimizer
        run: python run_optimizer.py 2>&1 | tee -a status.md
        env:
          PYTHONIOENCODING: utf-8

      - name: AVGO peer valuation snapshot
        run: python run_peer_valuation.py 2>&1 | tee -a status.md
        env:
          PYTHONIOENCODING: utf-8

      - name: Write step summary
        run: cat status.md >> $GITHUB_STEP_SUMMARY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/portfolio.toml status.md universe_screen_results.csv
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore(sync): daily update [skip ci]"
          git pull --rebase origin master
          git push

      - name: Notify on signal change
        run: python notify_signal_changes.py status.md.prev status.md
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          FORCE_TEST_TELEGRAM: ${{ github.event.inputs.test_telegram || 'false' }}
          SUPPRESS_NOTIFY: ${{ github.event.inputs.suppress_notify || 'false' }}
          FORCE_SEND_REBALANCE: ${{ github.event.inputs.force_send_rebalance || 'false' }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      - name: Sync health check
        run: python check_sync_health.py status.md

      - name: Heartbeat ping (healthchecks.io)
        # Only reached if every prior step succeeded -- a real pipeline
        # failure means this never fires, so a missed ping on the
        # healthchecks.io side is itself the alert for "the pipeline is
        # dead," independent of GitHub Actions entirely. `|| true` so a
        # transient healthchecks.io-side hiccup never fails the sync job.
        run: curl -fsS -m 10 --retry 3 "${{ secrets.HEALTHCHECKS_PING_URL }}" > /dev/null || true
