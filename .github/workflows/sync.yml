name: daily-sync

on:
  schedule:
    - cron: '30 20 * * 1-5'   # 22:30 CEST (20:30 UTC) Mon-Fri — after NYSE close
    - cron: '0 6 * * 1-5'     # 08:00 CEST (06:00 UTC) Mon-Fri — morning FRED catch-up
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Force-send a test Telegram message (bypasses signal-change diff)"
        type: boolean
        default: false
      suppress_notify:
        description: "Suppress signal-change notification (use when this run is a state correction, not a real event)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e .

      - name: Snapshot previous status.md
        run: cp status.md status.md.prev || true

      - name: Sync Google Sheet → portfolio.toml
        run: python sync_sheet.py

      - name: Update prices
        run: python -m asset_universe.update
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Save parquet cache
        uses: actions/cache/save@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}

      - name: Refresh universe screen
        run: mkdir -p logs && python run_universe_screen.py > logs/universe_screen.log 2>&1
        env:
          PYTHONIOENCODING: utf-8

      - name: Run fi_tracker
        run: python fi_tracker.py 2>&1 | tee status.md
        env:
          PYTHONIOENCODING: utf-8

      - name: Regime change alert
        run: python run_regime_alert.py 2>&1 | tee -a status.md
        env:
          PYTHONIOENCODING: utf-8

      - name: Portfolio optimizer
        run: python run_optimizer.py 2>&1 | tee -a status.md
        env:
          PYTHONIOENCODING: utf-8

      - name: Write step summary
        run: cat status.md >> $GITHUB_STEP_SUMMARY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/portfolio.toml status.md universe_screen_results.csv
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore(sync): daily update [skip ci]"
          git pull --rebase origin master
          git push

      - name: Notify on signal change
        run: python notify_signal_changes.py status.md.prev status.md
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          FORCE_TEST_TELEGRAM: ${{ github.event.inputs.test_telegram || 'false' }}
          SUPPRESS_NOTIFY: ${{ github.event.inputs.suppress_notify || 'false' }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      - name: Sync health check
        run: python check_sync_health.py status.md
