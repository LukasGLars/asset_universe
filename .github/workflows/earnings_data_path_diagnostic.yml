name: earnings-data-path-diagnostic

# Manual-only, temporary diagnostic: prints STLD's real earnings-date
# history from yfinance to confirm whether the entry screen's "NextEarn:
# 2026-10-19" is correct (forward-looking gate) given a possible earnings
# print around 2026-07-28. Read-only, no parquet store needed -- just one
# yfinance network call. Delete once answered.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Check STLD earnings dates
        run: python -u check_earnings_data_path.py 2>&1 | tee earnings_data_path_output.txt
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"

      - name: Write step summary
        run: cat earnings_data_path_output.txt >> $GITHUB_STEP_SUMMARY
