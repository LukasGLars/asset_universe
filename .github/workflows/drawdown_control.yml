name: drawdown-control

# Manual-only, TEMPORARY diagnostic (2026-08-31): how far can portfolio
# drawdown be cut by ALLOCATION alone (core weight mix x bucket split),
# with no signal and no forecast? Needs the real parquet store, which only
# exists on the Actions runner. Read-only: no commits, no repo changes.
#
# Delete this workflow, run_drawdown_control.py and
# tests/test_drawdown_control.py once the result is logged to MEMORY.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore parquet cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: parquet-${{ github.run_id }}
          restore-keys: parquet-

      - name: Install dependencies
        run: pip install -e . pytest

      - name: Ensure local data is fresh (auto-refreshes if stale)
        run: python check_local_data_freshness.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      # The bucket-blend accounting is what the recommendation rests on.
      # If these fail, do not read the numbers.
      - name: Blend / accounting tests
        run: python -m pytest tests/test_drawdown_control.py -q

      - name: Run drawdown-control analysis
        run: python run_drawdown_control.py 2>&1 | tee drawdown_control_output.txt
        env:
          PYTHONIOENCODING: utf-8

      - name: Write step summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat drawdown_control_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload grid CSV
        uses: actions/upload-artifact@v4
        with:
          name: drawdown-control-grid
          path: comparison_results/drawdown_control_grid.csv
