name: tpv-check-diagnostic

# Manual-only, temporary diagnostic: calls _fetch_sheet_tpv() directly and
# prints the result, nothing else. No parquet cache needed (pure network
# fetch), so this runs in seconds instead of the full daily sync's ~10
# minutes -- for quickly re-verifying the live sheet-derived TPV on demand.
# Read-only: no commits, no repo changes. Delete once no longer needed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Fetch live sheet TPV
        run: python -c "from asset_universe.portfolio import _fetch_sheet_tpv; print(f'LIVE SHEET TPV: {_fetch_sheet_tpv():,.0f} kr')"
